services:
  db:
    image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migrations/002_users_audit_categories.sql:/docker-entrypoint-initdb.d/02-users-audit-categories.sql:ro
      - ./migrations/003_soft_delete_parts_users.sql:/docker-entrypoint-initdb.d/03-soft-delete-parts-users.sql:ro
      - ./migrations/004_inventory_and_password_rules.sql:/docker-entrypoint-initdb.d/04-inventory-and-password-rules.sql:ro
      - ./migrations/005_soft_delete_workstations.sql:/docker-entrypoint-initdb.d/05-soft-delete-workstations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  frontend:
    driver: bridge
