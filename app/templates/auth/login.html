{% extends "base.html" %}
{% block anonymous_content %}
<section class="login-panel card content-card">
  <div class="card-body p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="metric-icon mb-3"><i class="bi bi-shield-lock"></i></div>
      <h1 class="h4">Учёт комплектующих АРМ МИАЦ</h1>
      <p class="text-secondary mb-0">Вход в защищённый контур</p>
    </div>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label required-label" for="username">Имя пользователя</label>
        <input class="form-control" id="username" name="username" maxlength="100" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label required-label" for="password">Пароль</label>
        <input class="form-control" type="password" id="password" name="password" maxlength="200" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i>Войти</button>
    </form>
  </div>
</section>
{% endblock %}
