{% extends "base.html" %}
{% block breadcrumbs %}<li class="breadcrumb-item"><a href="/workstations">АРМ</a></li><li class="breadcrumb-item active">{{ page_title }}</li>{% endblock %}
{% block content %}
<div class="row"><div class="col-12 col-xl-9"><div class="card content-card"><div class="card-body p-4"><h1 class="h4 mb-4">{{ page_title }}</h1>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" action="{% if workstation and workstation.id %}/workstations/{{ workstation.id }}/edit{% else %}/workstations/new{% endif %}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="row g-3">
  <div class="col-12"><label class="form-label required-label" for="name">Наименование АРМ</label><input class="form-control" id="name" name="name" maxlength="255" value="{{ workstation.name if workstation else '' }}" required></div>
  <div class="col-12 col-md-5"><label class="form-label required-label" for="cabinet">Кабинет</label><input class="form-control" id="cabinet" name="cabinet" maxlength="100" value="{{ workstation.cabinet if workstation else '' }}" required></div>
  <div class="col-12 col-md-7"><label class="form-label" for="responsible_id">Ответственный сотрудник</label><select class="form-select" id="responsible_id" name="responsible_id"><option value="">Не назначен</option>{% for employee in employees %}<option value="{{ employee.id }}" {% if workstation and workstation.responsible_id == employee.id %}selected{% endif %}>{{ employee.full_name }}{% if employee.department %} — {{ employee.department }}{% endif %}</option>{% endfor %}</select></div>
  <div class="col-12"><label class="form-label" for="description">Описание</label><textarea class="form-control" id="description" name="description" rows="3" maxlength="4000">{{ workstation.description or '' if workstation else '' }}</textarea></div>
</div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Сохранить</button><a class="btn btn-outline-secondary" href="{% if workstation and workstation.id %}/workstations/{{ workstation.id }}{% else %}/workstations{% endif %}">Отмена</a></div></form>
</div></div></div></div>
{% endblock %}
